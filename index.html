<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Measure repository spaghetti with Code Buster and watch it land in the bowl."
    />
    <link rel="icon" href="/spaghetti-meter.svg" type="image/svg+xml" />
    <title>Spaghetti Meter — project mess meter</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="startup-status" class="startup-status" role="status" aria-live="polite">
        <h1 id="startup-title">Starting Spaghetti Meter</h1>
        <p id="startup-detail">Loading interface modules</p>
        <pre id="startup-error" hidden></pre>
      </section>
    </div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare shared draft
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate release tag and versions
        run: npm run version:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Prepare changelog and download guidance
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create or reuse shared draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != "true" ]; then
              echo "Refusing to upload bundles to an already public release." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Spaghetti Meter $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: Linux x64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    env:
      SPAGHETTI_METER_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag and versions
        run: npm run version:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Check third-party notices
        run: npm run licenses:check

      - name: Build and upload bundles to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: Spaghetti Meter ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Verify macOS ad-hoc signatures
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Spaghetti Meter.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/cb"

  publish:
    name: Publish complete release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Prepare final changelog and download guidance
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Publish all platform bundles together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --title "Spaghetti Meter $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft=false
